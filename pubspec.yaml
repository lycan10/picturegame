name: picture_match
description: A picture-to-word matching game built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^10.0.0
  webview_flutter: ^4.10.0
  google_mobile_ads: ^9.2.0
  image_picker: ^1.2.4
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  flutter_timezone: ^5.1.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  games_services: ^5.3.0
  in_app_purchase: ^3.3.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
